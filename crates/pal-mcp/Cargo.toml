[package]
name = "pal-mcp"
description = "Local MCP server exposing the Palworld breeding calculator to Claude clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0"
pal-core = { workspace = true, features = ["vendored-data"] }
pal-pool.workspace = true
pal-solver.workspace = true
rmcp = { version = "3.1", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.0"
serde.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
